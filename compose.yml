# ========================================================== #
# ====================[ DOCKER COMPOSE ]==================== #
# ========================================================== #

services:
  # ================================================== #
  # ====================[ SERVER ]==================== #
  # ================================================== #

  server:
    build:
      context: ./server
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    env_file:
      - ./server/.env
    depends_on:
      mongodb:
        condition: service_healthy

  # ================================================== #
  # ===================[ MONGODB ]==================== #
  # ================================================== #

  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: mongodb
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:?Required}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Required}
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_search:/data/mongot
      - mongodb_config:/data/configdb

# ========================================================== #
# =======================[ NETWORKS ]======================= #
# ========================================================== #

networks:
  default:
    name: lightning
    driver: bridge

# ========================================================== #
# =======================[ VOLUMES ]======================== #
# ========================================================== #

volumes:
  mongodb_data:
  mongodb_search:
  mongodb_config:
